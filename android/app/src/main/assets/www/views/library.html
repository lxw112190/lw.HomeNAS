<section id="page-library" hidden>
  <form id="library-search-form" class="search-bar" role="search">
    <label class="search-input"><svg class="icon" aria-hidden="true"><use href="#icon-search"></use></svg><input id="library-search" type="search" enterkeyhint="search" maxlength="128" placeholder="搜索文件" aria-label="搜索文件名"></label>
    <button id="library-search-button" class="text-button" type="submit">搜索</button>
  </form>
  <div class="library-toolbar"><select id="library-order" aria-label="资料库展示"><option value="folders">文件夹</option><option value="timeline">时间线</option><option value="albums">主题图集</option></select><select id="library-type" aria-label="文件类型"><option value="all">全部文件</option><option value="image">照片</option><option value="video">视频</option><option value="file">其他文件</option></select><button id="load-library" class="icon-button" type="button" aria-label="刷新资料库"><svg class="icon" aria-hidden="true"><use href="#icon-refresh"></use></svg></button></div>
  <div id="library" class="gallery"></div>
  <div class="pager"><button id="library-prev" type="button" disabled>上一页</button><span id="library-page" role="status"></span><button id="more" type="button" disabled>下一页</button></div>
  <p class="page-caption">家庭共享资料库</p>
</section>
