<section hidden="" id="page-backup">
 <div class="panel" id="signed-out">
  <h2>
   先连接你的家庭电脑
  </h2>
  <p>
   使用管理员创建的用户名和密码。照片通过原生队列上传，关闭页面后可继续。
  </p>
  <button class="primary" id="go-connect">
   设置服务器与登录 →
  </button>
 </div>
 <div class="upload-only panel" hidden="">
  <h2>
   把文件带回家
  </h2>
  <p id="access">
  </p>
  <div class="actions">
   <button class="primary" id="choose">
    ＋ 选择照片、视频或文件
   </button>
   <button id="permission">
    授权 / 调整相册范围
   </button>
   <button id="metadata">
    保留照片原始元数据
   </button>
  </div>
  <small>
   原始元数据授权用于读取照片文件中的位置信息，不读取手机当前定位；未授权时系统可能脱敏。
  </small>
  <div class="actions">
   <button class="primary" id="start">
    立即备份 / 继续
   </button>
   <button id="pause">
    暂停全部上传
   </button>
  </div>
  <small>
   “选择文件”使用系统文件选择器；相册备份请先到设置中选择相册。暂停保留确认进度。
  </small>
 </div>
 <div class="stats">
  <div>
   <strong id="ready">
    0
   </strong>
   <span>
    已备份到电脑
   </span>
  </div>
  <div>
   <strong id="pending">
    0
   </strong>
   <span>
    等待 / 处理中
   </span>
  </div>
  <div>
   <strong id="failed">
    0
   </strong>
   <span>
    需要处理
   </span>
  </div>
 </div>
 <div class="panel">
  <div class="section-title">
   <h2>
    手机备份队列
   </h2>
   <button id="refresh">
    刷新
   </button>
  </div>
  <select aria-label="备份任务筛选" id="queue-filter">
   <option value="active">
    等待/处理中
   </option>
   <option value="failed">
    需要处理
   </option>
   <option value="ready">
    已完成
   </option>
   <option value="all">
    全部
   </option>
  </select>
  <div class="list" id="tasks">
   <p class="empty">
    尚未选择文件。
   </p>
  </div>
  <div class="actions">
   <button disabled="" id="queue-prev">
    上一页
   </button>
   <span id="queue-page">
    第1页
   </span>
   <button disabled="" id="queue-next">
    下一页
   </button>
  </div>
  <button class="upload-only" hidden="" id="retry">
   重试失败项
  </button>
 </div>
 <div class="tip">
  只有电脑完成整文件 SHA256 校验并确认入库，才显示“已备份”。手机删除文件不会删除电脑原件。电脑副本也建议再备份到第二块硬盘。
 </div>
</section>
