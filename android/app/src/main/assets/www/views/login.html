<section id="page-login" class="login-page">
  <div class="login-brand"><span class="app-icon"><svg class="icon" aria-hidden="true"><use href="#icon-server"></use></svg></span><h2>我的家庭备份</h2></div>
  <button id="login-server-button" class="server-picker" type="button" aria-label="设置服务器地址"><span>家庭服务器</span><span id="login-server">未设置</span><svg class="icon" aria-hidden="true"><use href="#icon-chevron"></use></svg></button>
  <form id="login">
    <label class="field-row"><span>账号</span><input id="username" autocomplete="username" autocapitalize="none" enterkeyhint="next" value="admin" maxlength="32" placeholder="用户名" required></label>
    <label class="field-row"><span>密码</span><input id="password" enterkeyhint="go" type="password" autocomplete="current-password" maxlength="256" placeholder="请输入密码" required></label>
    <button class="primary login-submit" type="submit">登录</button>
  </form>
  <div class="login-links"><button id="login-settings" class="text-button" type="button">连接设置</button><span>·</span><button class="text-button" type="button" data-help>帮助</button></div>
</section>
