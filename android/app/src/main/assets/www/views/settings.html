<section id="page-settings" hidden>
  <div id="profile" class="profile session-only" hidden><span class="avatar"><svg class="icon" aria-hidden="true"><use href="#icon-user"></use></svg></span><div><h2 id="profile-name">我的账号</h2><p id="connection"></p></div></div>
  <div class="settings-list">
    <details id="connection-settings" class="settings-group">
      <summary><svg class="icon" aria-hidden="true"><use href="#icon-server"></use></svg><span>连接设置</span><svg class="icon" aria-hidden="true"><use href="#icon-chevron"></use></svg></summary>
      <div class="settings-body">
        <label class="field-row"><span>连接方式</span><select id="protocol" aria-label="连接方式"><option value="http">HTTP</option><option value="https">HTTPS</option></select></label>
        <label class="field-row"><span>电脑地址</span><input id="host" value="192.168.1.100" maxlength="256" placeholder="IP 或主机名" autocapitalize="none" autocomplete="off" spellcheck="false" required></label>
        <label class="field-row"><span>端口</span><input id="port" type="number" inputmode="numeric" value="8787" min="1" max="65535" required></label>
        <code id="resolved-endpoint">http://192.168.1.100:8787</code>
        <p id="http-note" class="caption">HTTP不加密，请在可信网络中使用。</p>
        <button id="test-connection" class="secondary full" type="button">测试连接</button>
        <div id="certificate-options" class="certificate" hidden>
          <h3>服务器证书</h3><p class="caption">导入电脑的公开证书，并核对指纹。</p>
          <div class="actions"><button id="import-cert" type="button">导入证书</button><button id="clear-cert" type="button">清除</button></div>
          <code id="certificate"></code><label class="check"><input id="trust-cert" type="checkbox"><span>已核对证书指纹</span></label>
        </div>
        <button id="back-login" class="primary full" type="button">返回登录</button>
      </div>
    </details>
    <details class="settings-group upload-only" id="album-settings" hidden>
      <summary><svg class="icon" aria-hidden="true"><use href="#icon-album"></use></svg><span>相册与自动备份</span><svg class="icon" aria-hidden="true"><use href="#icon-chevron"></use></svg></summary>
      <form id="preferences" class="settings-body">
          <button id="auto-backup-folder" class="destination-button" type="button">自动备份到：默认文件夹　›</button>
        <p id="access" class="caption"></p>
        <div class="actions"><button id="permission" type="button">相册权限</button><button id="load-albums" type="button">选择相册</button></div>
        <p id="album-hint" class="caption">请选择要备份的相册</p>
        <div id="albums" class="albums"><p class="empty">点击“选择相册”读取列表</p></div>
        <label class="switch-row"><span>仅在 Wi-Fi 上传</span><input id="wifi" type="checkbox" checked></label>
        <label class="switch-row"><span>自动备份仅在充电时</span><input id="charging" type="checkbox"></label>
        <label class="switch-row"><span>定时备份所选相册</span><input id="auto" type="checkbox"></label>
        <div class="actions"><button class="primary" type="submit">保存设置</button><button id="scan" type="button">立即扫描</button></div>
        <details class="nested-details"><summary>原始照片信息</summary><p class="caption">可保留照片中的位置信息，不获取手机当前位置。</p><button id="metadata" type="button">保留原始元数据</button></details>
      </form>
    </details>
    <details class="settings-group session-only" hidden>
      <summary><svg class="icon" aria-hidden="true"><use href="#icon-update"></use></svg><span>软件更新</span><svg class="icon" aria-hidden="true"><use href="#icon-chevron"></use></svg></summary>
      <div class="settings-body"><p id="update-info" class="caption">检查应用与界面更新</p><button id="check-updates" class="secondary full" type="button">检查更新</button><div class="actions"><button id="update-resources" type="button">更新界面</button><button id="install-apk" type="button">更新应用</button></div></div>
    </details>
    <details class="settings-group" id="feedback-settings">
      <summary><svg class="icon" aria-hidden="true"><use href="#icon-chat"></use></svg><span>帮助与反馈</span><svg class="icon" aria-hidden="true"><use href="#icon-chevron"></use></svg></summary>
      <div class="settings-body"><button class="secondary full" type="button" data-help>使用帮助</button><label class="note-label">问题描述<textarea id="report-note" maxlength="500" rows="3" placeholder="简单描述遇到的问题"></textarea></label><button id="upload-logs" class="secondary full session-only" type="button" hidden>提交问题与日志</button><div class="actions"><button id="view-logs" type="button">查看日志</button><button id="export-logs" type="button">导出日志</button></div><p class="caption">日志包含设备与连接信息，不附带密码或原始文件。</p><small id="log-session"></small></div>
    </details>
    <details class="settings-group" id="about-settings">
      <summary><svg class="icon" aria-hidden="true"><use href="#icon-info"></use></svg><span>关于 lw.HomeNAS</span><svg class="icon" aria-hidden="true"><use href="#icon-chevron"></use></svg></summary>
      <div class="settings-body"><p>lw.HomeNAS <span id="version"></span></p><p class="caption">自己的文件，留在自己的电脑。</p><a href="./licenses.html">开源许可</a></div>
    </details>
  </div>
  <button id="logout" class="logout full" type="button" hidden>退出登录</button>
</section>
