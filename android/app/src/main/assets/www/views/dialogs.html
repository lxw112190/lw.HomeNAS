<dialog id="help-dialog" class="sheet">
  <div class="section-title"><h2>使用帮助</h2><button class="icon-button" type="button" data-close-dialog="help-dialog" aria-label="关闭帮助"><svg class="icon" aria-hidden="true"><use href="#icon-close"></use></svg></button></div>
  <div class="help-content">
    <h3>第一次使用</h3><p>连接手机与电脑所在的网络，在连接设置中填写电脑地址，测试连接后登录。</p>
    <h3>如何备份</h3><p>添加照片或文件，再点“开始备份”。相册与定时备份在“我”中设置。只读账号可浏览和保存资料。</p>
    <h3>暂停或退出后呢</h3><p>暂停保留上传进度。手动备份可通过通知栏继续；系统可能限制后台任务，重新打开后可继续。</p>
    <h3>定时备份</h3><p>由系统调度，间隔至少15分钟，受网络、充电和省电设置影响。大量文件建议手动备份。</p>
    <h3>文件会被删除吗</h3><p>手机删除不会删除电脑原件。“已备份”表示电脑已校验入库，重要文件建议再备份到第二块硬盘。家庭资料库共享。</p>
  </div>
  <button class="primary full" type="button" data-close-dialog="help-dialog">知道了</button>
</dialog>
<dialog id="logs-dialog" class="sheet">
  <div class="section-title"><h2>诊断日志</h2><button id="close-logs" class="icon-button" type="button" aria-label="关闭日志"><svg class="icon" aria-hidden="true"><use href="#icon-close"></use></svg></button></div>
  <p id="logs-info" class="caption"></p><pre id="logs-tail"></pre><button id="dialog-export" class="secondary full" type="button">导出完整日志</button>
</dialog>
