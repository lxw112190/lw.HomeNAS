<!DOCTYPE html>
<html lang="zh-CN">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width,initial-scale=1,viewport-fit=cover" name="viewport"/>
  <meta content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'" http-equiv="Content-Security-Policy"/>
  <title>
   lw.HomeNAS · 我的家庭备份
  </title>
  <link href="style.css" rel="stylesheet"/>
  <script defer="" src="./boot.js">
  </script>
 </head>
 <body>
  <header>
   <span class="brand">
    H
   </span>
   <div>
    <small>
     YOUR HOME, YOUR MEMORIES
    </small>
    <h1>
     我的家庭备份
    </h1>
   </div>
   <span id="version">
   </span>
  </header>
  <main>
   <section class="hero" id="app-hero">
    <div class="eyebrow">
     给回忆一个自己的家
    </div>
    <h2>
     手机里的珍贵瞬间，
     <br/>
     在家也有一份。
    </h2>
    <p>
     照片、视频、文档与录音，保存原件，分块续传。
    </p>
    <div id="connection">
     正在连接手机本地备份模块…
    </div>
   </section>
   <div class="notice" hidden="" id="error" role="alert">
   </div>
   <p id="message" role="status">
    手机与电脑请连接同一个家庭网络。
   </p>
   <div data-view="login">
   </div>
   <div data-view="backup">
   </div>
   <div data-view="library">
   </div>
   <div data-view="settings">
   </div>
  </main>
  <nav aria-label="功能" hidden="" id="bottom-nav">
   <button class="active" data-page="backup">
    备份
   </button>
   <button data-page="library">
    资料库
   </button>
   <button data-page="settings">
    连接与设置
   </button>
  </nav>
  <footer>
   lw.HomeNAS · 让回忆有一个自己的家。
   <a href="licenses.html">
    开源许可
   </a>
  </footer>
  <div data-view="dialogs">
  </div>
 </body>
</html>
