name: Build package and versioned Release

on:
  workflow_run:
    workflows: ['Android APK']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      android_run_id:
        description: 'Android APK run ID (blank: latest passing main run including emulator)'
        type: string
        required: false
      publish:
        description: Publish only if VERSION has not been released (otherwise artifacts only)
        type: boolean
        default: true

permissions:
  contents: read
  actions: read

jobs:
  select:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      run_id: ${{ steps.source.outputs.run_id }}
      run_number: ${{ steps.source.outputs.run_number }}
      sha: ${{ steps.source.outputs.sha }}
      artifact_name: ${{ steps.source.outputs.artifact_name }}
      tag: ${{ steps.source.outputs.tag }}
      version: ${{ steps.source.outputs.version }}
      publish: ${{ steps.source.outputs.publish }}
      already: ${{ steps.source.outputs.already }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate source workflow, jobs, commit and artifact
        id: source
        uses: actions/github-script@v7
        env:
          INPUT_ANDROID_RUN_ID: ${{ inputs.android_run_id }}
          INPUT_PUBLISH: ${{ inputs.publish }}
        with:
          script: |
            const select = require('./.github/scripts/select-release.cjs');
            await select({github,context,core});

  package:
    needs: select
    runs-on: windows-2022
    timeout-minutes: 35
    concurrency:
      group: package-android-${{ needs.select.outputs.run_id }}
      cancel-in-progress: false
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.select.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install verification dependencies
        run: python -m pip install requests pillow cryptography PyYAML
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/dom/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.select.outputs.artifact_name }}
          run-id: ${{ needs.select.outputs.run_id }}
          github-token: ${{ github.token }}
          path: incoming-android
      - name: Build and verify full Windows deployment
        shell: pwsh
        env:
          CI_NUMBER: ${{ needs.select.outputs.run_number }}
          CI_SHA: ${{ needs.select.outputs.sha }}
          UI_SIGNING_KEY_BASE64: ${{ secrets.UI_SIGNING_KEY_BASE64 }}
        run: |
          $ErrorActionPreference='Stop'
          if(-not (Test-Path -LiteralPath 'tools/build-release.ps1')){throw 'Select an Android run built after the release workflow was added.'}
          $keyFile=Join-Path $env:RUNNER_TEMP 'homenas-resource-signing.pem'
          try{
            $parameters=@{ArtifactDirectory=(Join-Path $PWD 'incoming-android');CiNumber=[int]$env:CI_NUMBER;CiSha=$env:CI_SHA}
            if($env:UI_SIGNING_KEY_BASE64){[IO.File]::WriteAllBytes($keyFile,[Convert]::FromBase64String($env:UI_SIGNING_KEY_BASE64));$parameters.UiKeyPath=$keyFile}
            & ./tools/build-release.ps1 @parameters
          }finally{if(Test-Path -LiteralPath $keyFile){Remove-Item -LiteralPath $keyFile -Force}}
      - uses: actions/upload-artifact@v4
        with:
          name: lw.HomeNAS-full-ci${{ needs.select.outputs.run_number }}
          path: |
            deliveries/release-assets/
            deliveries/release-notes.md
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Windows-release-checks-${{ github.run_id }}
          path: |
            test-results/*/RESULT.json
            test-results/*/*PASS.json
            test-results/package-release-pass.json
          if-no-files-found: warn
          retention-days: 7

  publish:
    needs: [select,package]
    if: needs.select.outputs.publish == 'true' && needs.select.outputs.already != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    concurrency:
      group: publish-version-${{ needs.select.outputs.tag }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.select.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: lw.HomeNAS-full-ci${{ needs.select.outputs.run_number }}
          path: verified
      - name: Publish verified assets from a draft
        uses: actions/github-script@v7
        env:
          CI_SHA: ${{ needs.select.outputs.sha }}
          CI_NUMBER: ${{ needs.select.outputs.run_number }}
        with:
          script: |
            const publish = require('./.github/scripts/publish-release.cjs');
            await publish({github,context,core,directory:'verified/release-assets',notes:'verified/release-notes.md',sha:process.env.CI_SHA,number:process.env.CI_NUMBER});
