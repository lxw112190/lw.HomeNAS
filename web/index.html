<!DOCTYPE html>
<html lang="zh-CN">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width,initial-scale=1" name="viewport"/>
  <title>
   lw.HomeNAS · 家庭资料库
  </title>
  <link href="./style.css" rel="stylesheet"/>
  <script defer="" src="./sha256.js">
  </script>
  <script defer="" src="./boot.js">
  </script>
 </head>
 <body>
  <div data-view="login">
  </div>
  <div class="shell hidden" id="shell">
   <aside class="sidebar" id="main-sidebar">
    <a class="brand" href="#">
     <span class="brand-icon">
      H
     </span>
     <span>
      lw.HomeNAS
      <small>
       家庭资料库
      </small>
     </span>
    </a>
    <p class="nav-label">
     我的空间
    </p>
    <nav>
     <button class="active" data-page="home">
      ◈
      <span>
       概览
      </span>
     </button>
     <button data-page="library">
      ▧
      <span>
       照片与文件
      </span>
     </button>
     <button data-page="transfers">
      ⇧
      <span>
       备份任务
      </span>
     </button>
     <button class="admin-only" data-page="users">
      ▣
      <span>
       用户管理
      </span>
     </button>
     <button data-page="settings">
      ⚙
      <span>
       存储与设置
      </span>
     </button>
    </nav>
    <div class="sidebar-bottom">
     <span class="status-dot">
     </span>
     <span id="connection">
      电脑已连接
     </span>
     <p id="account-name">
     </p>
     <p>
      家庭资料库
     </p>
     <button class="link" id="logout">
      退出连接
     </button>
    </div>
   </aside>
   <main>
    <header>
     <button aria-controls="main-sidebar" aria-expanded="true" class="secondary" id="menu-toggle">
      ☰ 折叠菜单
     </button>
     <div>
      <p class="eyebrow">
       A PLACE FOR EVERYTHING YOU LOVE
      </p>
      <h1 id="page-title">
       欢迎回家
      </h1>
     </div>
     <label class="button primary upload-only">
      ＋ 添加照片与文件
      <input hidden="" id="file-input" multiple="" type="file"/>
     </label>
    </header>
    <div class="notice hidden" id="transport-warning">
     当前是显式开启的局域网 HTTP 试用连接，数据传输未加密。正式备份请使用 HTTPS。
    </div>
    <div class="notice error hidden" id="global-error" role="alert">
    </div>
    <div data-view="home">
    </div>
    <div data-view="library">
    </div>
    <div data-view="transfers">
    </div>
    <div data-view="users">
    </div>
    <div data-view="settings">
    </div>
    <footer>
     lw.HomeNAS · 让回忆有一个自己的家。
    </footer>
   </main>
  </div>
  <div data-view="dialogs">
  </div>
  <div class="toast hidden" id="toast" role="status">
  </div>
 </body>
</html>
