<section class="auth hidden" id="auth">
 <div class="auth-card">
  <div class="mark">
   H
  </div>
  <p class="eyebrow">
   YOUR HOME, YOUR MEMORIES
  </p>
  <h1>
   把回忆，留在家里。
  </h1>
  <p id="server-name">
   lw.HomeNAS · 家庭资料库
  </p>
  <p>
   <a class="button secondary hidden" id="android-download">
    下载安卓客户端 APK
   </a>
   <span id="android-download-info">
    安卓安装包尚未发布
   </span>
  </p>
  <form id="login-form">
   <label>
    用户名
    <input autocomplete="username" id="username" maxlength="32" placeholder="请输入用户名" required="" value="admin"/>
   </label>
   <label>
    密码
    <input autocomplete="current-password" id="password" placeholder="请输入密码" required="" type="password"/>
   </label>
   <button class="primary full">
    登录家庭资料库
   </button>
  </form>
  <p class="error" id="auth-error" role="alert">
  </p>
  <p class="fine">
   由管理员创建账号。首次管理员用户名为 admin，初始密码见服务器控制台。
  </p>
 </div>
</section>
