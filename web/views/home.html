<section class="page" id="page-home">
 <div class="hero">
  <div>
   <span class="badge">
    你的文件，你来保管
   </span>
   <h2>
    手机里的珍贵瞬间，
    <br/>
    在家也有一份。
   </h2>
   <p>
    照片、视频、文档和录音，完整保存原件。
    <br/>
    支持分块续传与 SHA256 校验。
   </p>
   <button class="primary upload-only" id="hero-upload">
    开始备份　↗
   </button>
   <p class="app-download">
    <a class="button secondary hidden" id="home-android-download">
     下载安卓 App
    </a>
    <span id="home-android-info">
     安卓安装包尚未发布
    </span>
   </p>
  </div>
  <div aria-hidden="true" class="hero-art">
   <div class="photo-card">
    ☀
    <span>
     HOME / MEMORIES
    </span>
   </div>
   <div class="storage-card">
    ✓
    <span>
     原件已校验
    </span>
   </div>
  </div>
 </div>
 <div class="stats">
  <article>
   <span>
    已入库文件
   </span>
   <strong id="stat-files">
    —
   </strong>
   <small>
    完整校验后计入
   </small>
  </article>
  <article>
   <span>
    原件占用
   </span>
   <strong id="stat-bytes">
    —
   </strong>
   <small>
    含回收站保留的原件
   </small>
  </article>
  <article>
   <span>
    磁盘可用
   </span>
   <strong id="stat-free">
    —
   </strong>
   <small id="stat-reserved">
    正在读取容量
   </small>
  </article>
  <article>
   <span>
    待完成任务
   </span>
   <strong id="stat-active">
    —
   </strong>
   <small>
    可重选文件后续传
   </small>
  </article>
 </div>
 <div class="home-summary">
  <article class="panel home-storage">
   <div class="section-head"><h2>存储空间</h2><button class="link" id="home-refresh" type="button">刷新概览</button></div>
   <strong id="home-disk-text">正在读取容量…</strong>
   <progress id="home-disk-progress" max="100" value="0" aria-label="所在磁盘已用空间"></progress>
   <p id="home-storage-note">磁盘已用空间包含其他应用和文件，原件占用单独统计。</p>
   <p id="home-trash-text"></p>
  </article>
  <article class="panel">
   <h2>资料库与任务</h2>
   <div class="home-type-links">
    <button type="button" class="secondary" data-home-type="image">照片 <strong id="home-photo-count">—</strong></button>
    <button type="button" class="secondary" data-home-type="video">视频 <strong id="home-video-count">—</strong></button>
    <button type="button" class="secondary" data-home-type="file">其他文件 <strong id="home-other-count">—</strong></button>
   </div>
   <p id="home-task-summary">正在读取任务状态…</p>
   <div class="collection-actions"><button type="button" class="secondary" data-page="transfers">查看备份任务</button><button type="button" class="secondary" data-home-mode="folders">浏览文件夹</button><button type="button" class="secondary" data-home-mode="albums">查看图集</button><button type="button" class="secondary upload-only" data-home-mode="trash">回收站</button></div>
   <p class="fine" id="home-overview-scope"></p>
  </article>
 </div>
 <div class="section-head">
  <h2>
   最近入库
  </h2>
  <button class="link" id="see-all">
   查看全部 →
  </button>
 </div>
 <div class="gallery" id="recent">
 </div>
 <p class="hint">
  本网页上传需保持页面打开；刷新后重选相同文件可继续。安卓客户端提供原生队列与定时相册备份。
 </p>
</section>
