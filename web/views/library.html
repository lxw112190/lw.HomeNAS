<section class="page hidden" id="page-library">
 <div class="toolbar">
 <label>时间线<select id="library-order"><option value="timeline">文件时间</option><option value="created">入库时间</option></select></label>
  <div class="filter">
   <button class="selected" data-type="all">
    全部
   </button>
   <button data-type="image">
    照片
   </button>
   <button data-type="video">
    视频
   </button>
   <button data-type="file">
    其他文件
   </button>
  </div>
  <input id="search" maxlength="128" placeholder="搜索文件名" type="search"/>
 </div>
 <div class="gallery" id="library">
 </div>
 <div class="pager">
  <button class="secondary" disabled="" id="library-prev">
   上一页
  </button>
  <span id="library-status" role="status">
  </span>
  <button class="secondary" disabled="" id="load-more">
   下一页
  </button>
 </div>
</section>
