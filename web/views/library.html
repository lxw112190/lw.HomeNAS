<section class="page hidden" id="page-library">
 <div class="toolbar">
 <label>展示<select id="library-order"><option value="folders">文件夹</option><option value="timeline">时间线</option><option value="albums">主题图集</option><option value="trash">回收站</option></select></label>
  <div class="filter">
   <button class="selected" data-type="all">
    全部
   </button>
   <button data-type="image">
    照片
   </button>
   <button data-type="video">
    视频
   </button>
   <button data-type="file">
    其他文件
   </button>
  </div>
  <label>排列<select id="library-sort"><option value="">默认顺序</option><option value="name_asc">名称 A→Z</option><option value="name_desc">名称 Z→A</option><option value="modified_desc">修改时间（新→旧）</option><option value="size_desc">大小（大→小）</option><option value="size_asc">大小（小→大）</option></select></label>
  <label>布局<select id="library-layout"><option value="grid">网格</option><option value="list">列表</option></select></label>
  <input id="search" maxlength="128" placeholder="搜索文件名" type="search"/>
 </div>
 <div class="gallery" id="library">
 </div>
 <div class="pager">
  <button class="secondary" disabled id="library-first">首页</button>
  <button class="secondary" disabled="" id="library-prev">
   上一页
  </button>
  <span id="library-status" role="status">
  </span>
  <button class="secondary" disabled="" id="load-more">
   下一页
  </button>
  <button class="secondary" disabled id="library-last">尾页</button>
 </div>
</section>
